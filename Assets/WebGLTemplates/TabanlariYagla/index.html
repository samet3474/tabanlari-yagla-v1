<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="apple-mobile-web-app-title" content="{{{ PRODUCT_NAME }}}">
    <meta name="theme-color" content="#231f20">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="apple-touch-icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin: 0; background: #231f20; overscroll-behavior: none; }
      body.ty-desktop { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      #unity-container.unity-mobile { touch-action: none; }
      #unity-footer { display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // Safari, Unity'nin callback ile çağırdığı decodeAudioData'nın promise'ini de reddediyor.
      // Unity hatayı callback'te zaten işliyor; yakalanmamış promise reddi oyunu durdurmasın diye
      // promise'e boş bir catch ekliyoruz.
      (function () {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var proto = (window.BaseAudioContext || Ctx).prototype;
        var original = proto.decodeAudioData;
        proto.decodeAudioData = function (data, onSuccess, onError) {
          var result;
          try {
            result = original.call(this, data, onSuccess, onError);
          } catch (e) {
            if (onError) onError(e);
            return Promise.resolve(null);
          }
          if (result && result.catch) result.catch(function (e) { console.warn("Ses çözülemedi, atlandı:", e); });
          return result;
        };
      })();

      function isAudioDecodeError(msg) {
        msg = String(msg || "");
        return msg.indexOf("EncodingError") !== -1 || msg.indexOf("Decoding failed") !== -1 || msg.indexOf("Unable to decode audio") !== -1;
      }

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        errorHandler: function (err) {
          if (isAudioDecodeError(err && err.message ? err.message : err)) {
            console.warn("Ses hatası yok sayıldı:", err);
            return true;
          }
          return false;
        },
      };

      // PlayerData.Save() düz FileStream ile save.bin yazıyor; bu ayar kapalıyken dosya yalnızca bellekteki
      // sanal dosya sisteminde kalıyor ve IndexedDB'ye ancak Unity'nin başka bir iç senkronizasyonuyla
      // tesadüfen ulaşıyordu. Açıkken persistentDataPath'teki her dosya kapanışında IndexedDB'ye yazılır.
      config.autoSyncPersistentDataPath = true;

      window.addEventListener("unhandledrejection", function (e) {
        if (isAudioDecodeError(e.reason && e.reason.message ? e.reason.message : e.reason)) e.preventDefault();
      });

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // Telefon ekranları 3x yoğunlukta; tam çözünürlükte çizmek kare hızını düşürür.
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      } else {
        // Masaüstünde telefon oranında dikey pencere.
        document.body.className = "ty-desktop";
        var h = Math.min(window.innerHeight - 20, 900);
        canvas.style.width = Math.round(h * 9 / 16) + "px";
        canvas.style.height = h + "px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          if (!isAudioDecodeError(message)) alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
