<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="apple-mobile-web-app-title" content="Tabanları Yağla">
    <meta name="theme-color" content="#1B2550">
    <title>Tabanları Yağla</title>
    <!-- manifest start_url/scope are relative ("./"), so they resolve to the page's own folder (/tabanlari-yagla-v1/);
         the web save folder is derived from that path, so it must not change. No service worker on purpose. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="TemplateData/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="TemplateData/icons/apple-touch-icon-180.png">
    <link rel="apple-touch-startup-image" href="TemplateData/acilis-iphone13-1170x2532.png"
          media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin: 0; background: #1B2550; overscroll-behavior: none; }
      body.ty-desktop { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      #unity-container.unity-mobile { touch-action: none; }
      #unity-canvas { background: #1B2550; }
      #unity-footer { display: none; }
      /* Loading screen: game logo instead of the Unity logo (style.css is left unchanged). */
      #unity-logo { width: 280px; height: 158px; background: url('TemplateData/brand-logo.png') no-repeat center / contain; }
      #unity-progress-bar-empty { margin: 14px auto 0; }
      /* Shown only when a phone is held sideways; the game is designed for portrait. */
      #ty-rotate { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
                   background: #1B2550; color: #FFE45C; font: bold 20px/1.4 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
      @media (orientation: landscape) and (max-height: 500px) { .unity-mobile ~ #ty-rotate, body.ty-mobile #ty-rotate { display: flex; } }
      /* Açılış: 1) ortada yalnız logo (kısa), 2) yükleme ekranı: üstte logo, altta dolan çubuk + yüzde + ipucu.
         İndirme %0-80'i doldurur; oyun açılınca Unity'deki yükleme ekranı aynı çubuğu %80'den %100'e götürür. */
      #ty-loader { position: fixed; inset: 0; z-index: 5; background: #1B2550; overflow: hidden;
                   font: 800 18px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
      #ty-loader-logo { position: absolute; left: 50%; top: 50%; width: min(78vw, 420px); aspect-ratio: 16 / 9;
                        transform: translate(-50%, -50%); background: url('TemplateData/brand-logo.png') no-repeat center / contain;
                        transition: top .45s ease, width .45s ease; }
      #ty-loader-bottom { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh);
                          padding: 0 7vw; opacity: 0; transition: opacity .35s ease; text-align: center; }
      #ty-loader-tip { margin: 0 auto 18px; max-width: 520px; text-shadow: 0 2px 3px rgba(0,0,0,.6); }
      #ty-loader-tip b { color: #FFD24D; }
      #ty-loader-track { position: relative; height: 38px; max-width: 520px; margin: 0 auto; border-radius: 19px;
                         background: #0E1530; border: 3px solid #2D3A73; box-sizing: border-box; overflow: hidden; }
      #ty-loader-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 16px;
                        background: linear-gradient(#FFB43A, #F07A12); transition: width .25s linear; }
      #ty-loader-pct { position: relative; line-height: 32px; font-size: 20px; text-shadow: 0 2px 2px rgba(0,0,0,.55); }
      #ty-loader.ty-loading #ty-loader-logo { top: calc(env(safe-area-inset-top, 0px) + 22vh); width: min(70vw, 380px); }
      #ty-loader.ty-loading #ty-loader-bottom { opacity: 1; }
      #unity-loading-bar { display: none !important; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <div id="ty-loader">
      <div id="ty-loader-logo"></div>
      <div id="ty-loader-bottom">
        <div id="ty-loader-tip"></div>
        <div id="ty-loader-track"><div id="ty-loader-fill"></div><div id="ty-loader-pct">0%</div></div>
      </div>
    </div>
    <div id="ty-rotate">Daha iyi oynamak için telefonunu dik tut.</div>
    <script>
      // Safari, Unity'nin callback ile çağırdığı decodeAudioData'nın promise'ini de reddediyor.
      // Unity hatayı callback'te zaten işliyor; yakalanmamış promise reddi oyunu durdurmasın diye
      // promise'e boş bir catch ekliyoruz.
      (function () {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var proto = (window.BaseAudioContext || Ctx).prototype;
        var original = proto.decodeAudioData;
        proto.decodeAudioData = function (data, onSuccess, onError) {
          var result;
          try {
            result = original.call(this, data, onSuccess, onError);
          } catch (e) {
            if (onError) onError(e);
            return Promise.resolve(null);
          }
          if (result && result.catch) result.catch(function (e) { console.warn("Ses çözülemedi, atlandı:", e); });
          return result;
        };
      })();

      function isAudioDecodeError(msg) {
        msg = String(msg || "");
        return msg.indexOf("EncodingError") !== -1 || msg.indexOf("Decoding failed") !== -1 || msg.indexOf("Unable to decode audio") !== -1;
      }

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebDev.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebDev.data.unityweb",
        frameworkUrl: buildUrl + "/WebDev.framework.js.unityweb",
        codeUrl: buildUrl + "/WebDev.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Samet",
        productName: "Tabanları Yağla",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        errorHandler: function (err) {
          if (isAudioDecodeError(err && err.message ? err.message : err)) {
            console.warn("Ses hatası yok sayıldı:", err);
            return true;
          }
          return false;
        },
      };

      // PlayerData.Save() düz FileStream ile save.bin yazıyor; bu ayar kapalıyken dosya yalnızca bellekteki
      // sanal dosya sisteminde kalıyor ve IndexedDB'ye ancak Unity'nin başka bir iç senkronizasyonuyla
      // tesadüfen ulaşıyordu. Açıkken persistentDataPath'teki her dosya kapanışında IndexedDB'ye yazılır.
      config.autoSyncPersistentDataPath = true;

      window.addEventListener("unhandledrejection", function (e) {
        if (isAudioDecodeError(e.reason && e.reason.message ? e.reason.message : e.reason)) e.preventDefault();
      });

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        document.body.classList.add("ty-mobile");

        // Telefon ekranları 3x yoğunlukta; 3x kare hızını düşürür, 1,5x karakterleri bulanık gösterir: 2x.
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      } else {
        // Masaüstünde telefon oranında dikey pencere.
        document.body.className = "ty-desktop";
        var h = Math.min(window.innerHeight - 20, 900);
        canvas.style.width = Math.round(h * 9 / 16) + "px";
        canvas.style.height = h + "px";
      }

      // Açılış ekranı: logo kısa süre görünür (indirme bu sırada sürer), sonra yükleme ekranına geçilir.
      var tyLoader = document.querySelector("#ty-loader");
      var tyTips = [
        "Sağa sola kaydırarak engellerin yanından geç!",
        "Alçak bariyerin üstünden yukarı kaydırarak zıpla!",
        "Yüksek bariyerin altından aşağı kaydırarak kay!",
        "Topladığın balık kılçıklarıyla mağazadan yeni karakterler al!",
        "Görevleri tamamlayarak ödül kazan!"
      ];
      document.querySelector("#ty-loader-tip").innerHTML = "<b>İpucu:</b> " + tyTips[Math.floor(Math.random() * tyTips.length)];
      setTimeout(function () { tyLoader.classList.add("ty-loading"); }, 800);
      // Tek çubuk: indirme %0-80, oyunun kendi yüklemesi %80-100 (Loading.jslib -> tyLoadingProgress). Hiç geri gitmez.
      var tyShown = 0;
      function tySetBar(fraction) {
        var pct = Math.floor(100 * Math.max(tyShown, Math.min(1, fraction)));
        tyShown = pct / 100;
        document.querySelector("#ty-loader-fill").style.width = pct + "%";
        document.querySelector("#ty-loader-pct").textContent = pct + "%";
      }
      function tyProgress(p) { tySetBar(0.8 * Math.max(0, Math.min(1, p))); }
      window.tyLoadingProgress = function (fraction) { tySetBar(fraction); };
      // Ana menü açıldı: yükleme ekranı kapanır (yedek: oyun bildirmezse 60 sn sonra yine kapanır).
      window.tyLoadingDone = function () { tySetBar(1); setTimeout(function () { tyLoader.style.display = "none"; }, 120); };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          tyProgress(progress);
        }).then((unityInstance) => {
          // Oyun açıldı: aynı ekran açık kalır, çubuğu oyunun kendi yüklemesi %80'den %100'e götürür.
          tyProgress(1);
          setTimeout(function () { if (tyLoader.style.display !== "none") window.tyLoadingDone(); }, 60000);
        }).catch((message) => {
          if (!isAudioDecodeError(message)) alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
